services:
  opensurge:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      args:
        OPENSURGE_VERSION: ${OPENSURGE_VERSION:-dev}
    image: opensurge-for-qnap:${OPENSURGE_VERSION:-dev}
    container_name: opensurge
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      OPENSURGE_ALLOWED_HOSTS: ${OPENSURGE_ALLOWED_HOSTS:-}
    volumes:
      - ${OPENSURGE_DATA_PATH:-./data}:/data
    networks:
      opensurge_lan:
        ipv4_address: ${OPENSURGE_IP:?set OPENSURGE_IP to a free static LAN address}
    stop_grace_period: 30s

# QNET is QNAP Container Station's native L2 driver. QNAP recommends it when a
# container needs its own static LAN address and the NAS host/other containers
# may also need to reach that address. Do not replace this with host networking.
networks:
  opensurge_lan:
    driver: qnet
    driver_opts:
      iface: ${OPENSURGE_PARENT_INTERFACE:?set the QNAP LAN interface}
    ipam:
      driver: qnet
      options:
        iface: ${OPENSURGE_PARENT_INTERFACE:?set the QNAP LAN interface}
      config:
        - subnet: ${OPENSURGE_SUBNET:?set the LAN CIDR, e.g. 192.168.2.0/24}
          gateway: ${OPENSURGE_GATEWAY:?set the main router IPv4 address}

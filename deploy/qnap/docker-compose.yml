services:
  opensurge:
    image: ${OPENSURGE_IMAGE:-zyk1172/opensurge-for-qnap:1.0.0}
    pull_policy: ${OPENSURGE_PULL_POLICY:-missing}
    container_name: opensurge
    restart: unless-stopped

    cap_add:
      - NET_ADMIN
      - NET_RAW

    devices:
      - /dev/net/tun:/dev/net/tun

    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
      # OpenSurge for QNAP is intentionally IPv4-only. Disable IPv6 in the
      # container namespace so legacy configs cannot accidentally re-enable an
      # unsupported data plane.
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
      net.ipv6.conf.eth0.disable_ipv6: "1"

    security_opt:
      - no-new-privileges:true

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      OPENSURGE_ROLE: gateway
      OPENSURGE_WEB_ADDR: 0.0.0.0:8080
      OPENSURGE_ALLOWED_HOSTS: ${OPENSURGE_ALLOWED_HOSTS:-}
      OPENSURGE_WEB_UID: ${OPENSURGE_WEB_UID:-1000}
      OPENSURGE_WEB_GID: ${OPENSURGE_WEB_GID:-100}
      # Set true only when clients reach OpenSurge through an HTTPS reverse
      # proxy. Cookies will then carry Secure and the Web response emits HSTS.
      OPENSURGE_SECURE_COOKIES: ${OPENSURGE_SECURE_COOKIES:-false}

      # Creation-time network seed. These values are used only when
      # /data/config/opensurge.yaml does not exist; an existing persistent
      # configuration is never overwritten on container recreation.
      OPENSURGE_SEED_LAN_IP: ${OPENSURGE_IP:?set OpenSurge static IPv4 when creating the container}
      OPENSURGE_SEED_LAN_CIDR: ${OPENSURGE_SUBNET:?set LAN CIDR when creating the container}
      OPENSURGE_SEED_UPSTREAM_GATEWAY: ${OPENSURGE_GATEWAY:?set upstream router IPv4 when creating the container}
      OPENSURGE_CONTAINER_INTERFACE: ${OPENSURGE_CONTAINER_INTERFACE:-eth0}

    volumes:
      - ${OPENSURGE_DATA_PATH:?set absolute QNAP /share/... persistence path}:/data

    networks:
      opensurge_lan:
        ipv4_address: ${OPENSURGE_IP:?set OpenSurge static IPv4 when creating the container}

    logging:
      driver: json-file
      options:
        max-size: "${OPENSURGE_LOG_MAX_SIZE:-10m}"
        max-file: "${OPENSURGE_LOG_MAX_FILES:-3}"

    stop_grace_period: 30s

networks:
  opensurge_lan:
    name: opensurge-qnet
    driver: qnet
    driver_opts:
      iface: ${OPENSURGE_PARENT_INTERFACE:?select QNAP physical NIC or Virtual Switch when creating the container}
    ipam:
      driver: qnet
      options:
        iface: ${OPENSURGE_PARENT_INTERFACE:?select QNAP physical NIC or Virtual Switch when creating the container}
      config:
        - subnet: ${OPENSURGE_SUBNET:?set LAN CIDR when creating the container}
          gateway: ${OPENSURGE_GATEWAY:?set upstream router IPv4 when creating the container}

x-opensurge-image: &opensurge-image
  image: opensurge-for-qnap:test
  pull_policy: never

services:
  opensurge-manager:
    <<: *opensurge-image
    container_name: opensurge-manager
    restart: unless-stopped
    network_mode: host
    environment:
      OPENSURGE_ROLE: manager
      OPENSURGE_MANAGER_WEB_ADDR: 0.0.0.0:61780
      OPENSURGE_ORCHESTRATOR_SOCKET: /run/opensurge/orchestrator.sock
    volumes:
      - opensurge_manager_data:/data
      - opensurge_orchestrator_run:/run/opensurge
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:61780/health/live"]
      interval: 30s
      timeout: 4s
      start_period: 10s
      retries: 3

  opensurge-orchestrator:
    <<: *opensurge-image
    container_name: opensurge-orchestrator
    restart: unless-stopped
    network_mode: none
    environment:
      OPENSURGE_ROLE: orchestrator
      OPENSURGE_ORCHESTRATOR_SOCKET: /run/opensurge/orchestrator.sock
      OPENSURGE_DOCKER_SOCKET: /var/run/docker.sock
      OPENSURGE_GATEWAY_IMAGE: opensurge-for-qnap:test
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - opensurge_orchestrator_run:/run/opensurge
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/opensurge/orchestrator.sock"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  opensurge_manager_data:
  opensurge_orchestrator_run:

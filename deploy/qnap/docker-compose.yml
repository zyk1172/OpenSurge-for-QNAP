services:
  opensurge-host-agent:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      args:
        OPENSURGE_VERSION: dev
    image: opensurge-for-qnap:dev
    container_name: opensurge-host-agent
    restart: unless-stopped

    # The agent is deliberately tiny and has no LAN-facing port. It is the only
    # component allowed to see Docker's privileged control socket. Running in
    # the host network namespace lets it enumerate the real QNAP NICs that the
    # Web setup wizard presents to the administrator.
    network_mode: host
    entrypoint:
      - /usr/bin/tini
      - --
      - /usr/local/bin/opensurge-host-agent
    command:
      - --socket
      - /run/opensurge-host/agent.sock
      - --container
      - opensurge
      - --network
      - opensurge-qnet
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - opensurge_host_agent:/run/opensurge-host

  opensurge:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      args:
        OPENSURGE_VERSION: dev
    image: opensurge-for-qnap:dev
    container_name: opensurge
    restart: unless-stopped
    labels:
      io.opensurge.qnap.managed: "true"

    # Bootstrap management access is intentionally independent of QNET. The
    # administrator opens http://<QNAP-IP>:18080, then chooses the QNAP NIC,
    # OpenSurge LAN IP, subnet and router entirely in the Web UI. The host agent
    # attaches opensurge-qnet afterwards without dropping this management path.
    ports:
      - "18080:8080"

    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    security_opt:
      - no-new-privileges:true

    # Docker-managed named storage removes the need to choose a QNAP path before
    # first login. Everything under /data remains persistent across recreate.
    volumes:
      - opensurge_data:/data
      - opensurge_host_agent:/run/opensurge-host

    depends_on:
      - opensurge-host-agent
    networks:
      - opensurge_bootstrap

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

networks:
  opensurge_bootstrap:
    driver: bridge

volumes:
  opensurge_data:
    name: opensurge-data
  opensurge_host_agent:
    name: opensurge-host-agent

gateway:
  interface: "en0"
  lan_ip: "192.168.50.1"
  lan_prefix_len: 24
  upstream_interface: "en0"

dhcp:
  binary: "dnsmasq"
  enabled: true
  range_start: "192.168.50.100"
  range_end: "192.168.50.200"
  lease_time: "12h"
  domain: "lan"

device_policy:
  file: ""

dns:
  listen: "192.168.50.1"
  port: 53
  upstream: "127.0.0.1#1053"
  ipv6: false

mihomo:
  binary: "./bin/mihomo"
  config: "./runtime/mihomo.yaml"
  profile_mode: "imported"
  profile: "./mihomo-profile.example.yaml"
  store_fake_ip: true
  mixed_port: 7890
  redir_port: 0
  api_addr: "127.0.0.1:9090"
  secret: ""

nftables:
  table_name: opensurge
  fw_mark: 0x29
  route_table_id: 20241
  route_rule_priority: 20241

transparent:
  mode: "off"
  tun_device: "tun0"
  tun_stack: "mixed"
  tun_auto_route: false
  tun_auto_detect_interface: false
  tun_strict_route: false
  tun_ipv6: "off"
  ipv6_shared_l2_ready: false
  ipv6_packet_broker_binary: ""
  ipv6_packet_mtu: 0

local_system_proxy:
  enabled: false

runtime:
  dir: "./runtime"

gateway:
  interface: "en0"
  lan_ip: "192.168.50.1"
  lan_prefix_len: 24
  upstream_interface: "en0"

dhcp:
  binary: "dnsmasq"
  enabled: true
  range_start: "192.168.50.100"
  range_end: "192.168.50.200"
  lease_time: "12h"
  domain: "lan"
  bypass_gateway: ""
  bypass_dns: ""

device_policy:
  file: ""

dns:
  listen: "192.168.50.1"
  port: 53
  upstream: "127.0.0.1#1053"
  ipv6: false

mihomo:
  binary: "./bin/mihomo"
  config: "./runtime/mihomo.yaml"
  profile_mode: "managed"
  profile: ""
  store_fake_ip: true
  mixed_port: 7890
  redir_port: 0
  api_addr: "127.0.0.1:9090"
  secret: ""

nftables:
  table_name: "opensurge"
  fw_mark: 0x29
  route_table_id: 20241
  route_rule_priority: 20241

transparent:
  mode: "off"
  tun_device: "tun0"
  tun_stack: "mixed"
  # Linux policy routing is owned by OpenSurge. Do not let mihomo create a
  # second set of routes that cannot be ownership-checked or rolled back.
  tun_auto_route: false
  tun_auto_detect_interface: false
  tun_strict_route: false
  tun_ipv6: "off"
  ipv6_shared_l2_ready: false
  ipv6_packet_broker_binary: ""
  ipv6_packet_mtu: 0

local_system_proxy:
  # Legacy upstream field retained for config round-trip compatibility during
  # Phase 1. It has no QNAP/Linux runtime effect and must remain disabled.
  enabled: false

upstream_proxy:
  enabled: false
  name: "real-device-egress"
  type: "http"
  server: "127.0.0.1"
  port: 18080
  username: ""
  password: ""
  match_domain: "example.com"

tailscale:
  enabled: false
  display_name: "Tailnet"
  hostname: "opensurge-qnap"
  control_url: "https://controlplane.tailscale.com"
  auth_key_file: "./data/tailscale-auth-key"
  state_dir: "./data/tailscale"
  accept_routes: false
  magic_dns_suffixes: ""
  peer_cidrs: ""
  subnet_routes: ""
  allow_mac: true
  allow_all_devices: false
  allowed_devices: ""
  exit_node: ""
  exit_node_allow_lan_access: false

runtime:
  dir: "./runtime"

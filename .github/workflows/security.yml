name: Security gate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  image-vulnerabilities:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build QNAP image
        run: |
          docker build \
            --file docker/Dockerfile \
            --build-arg OPENSURGE_VERSION="security-${GITHUB_SHA::12}" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag opensurge-for-qnap:security \
            .
      - name: Reject HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opensurge-for-qnap:security
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          vuln-type: os,library

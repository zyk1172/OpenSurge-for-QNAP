name: Multi-NAS deployment

on:
  push:
    branches: [master]
    paths: ['deploy/**', 'tests/deployment/**', 'web/**', 'docker/**', 'internal/webgateway/**', 'internal/platform/**', 'cmd/opensurge-container/**', '.github/workflows/nas-deployment.yml']
  pull_request:
    paths: ['deploy/**', 'tests/deployment/**', 'web/**', 'docker/**', 'internal/webgateway/**', 'internal/platform/**', 'cmd/opensurge-container/**', '.github/workflows/nas-deployment.yml']

permissions:
  contents: read

jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate shell and all NAS profiles
        run: |
          sh -n deploy/qnap/preflight.sh
          sh -n deploy/nas/preflight.sh
          sh -n deploy/nas/kernel-probe.sh
          sh -n docker/entrypoint.sh
          python3 tests/deployment/test_nas.py
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install, test and build portable NAS target
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          OPENSURGE_TARGET=nas pnpm build
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build disposable network test image
        run: |
          mkdir -p /tmp/opensurge-nas-kernel
          CGO_ENABLED=0 go test -c -o /tmp/opensurge-nas-kernel/network.test ./internal/platform/linux
          cp deploy/nas/kernel-probe.sh /tmp/opensurge-nas-kernel/
          docker build -f tests/deployment/Dockerfile -t opensurge-nas-kernel-check /tmp/opensurge-nas-kernel
      - name: Verify macvlan, real TUN and TCP/UDP routing in a disposable namespace
        run: |
          sudo modprobe tun
          docker run --rm --network none --cap-add NET_ADMIN --cap-add NET_RAW \
            -e OPENSURGE_DISPOSABLE_PROBE=1 \
            --device /dev/net/tun:/dev/net/tun \
            --sysctl net.ipv4.ip_forward=1 \
            --sysctl net.ipv4.conf.all.rp_filter=0 \
            --sysctl net.ipv4.conf.default.rp_filter=0 \
            --sysctl net.ipv6.conf.all.disable_ipv6=1 \
            opensurge-nas-kernel-check sh -ec '
              sh /kernel-probe.sh
              OPEN_SURGE_NETWORK_TESTS=1 /network.test -test.v -test.run "^TestNetworkIngressInterface"
            ' | tee /tmp/opensurge-nas-kernel.log
          ! grep -q -- '--- SKIP:' /tmp/opensurge-nas-kernel.log

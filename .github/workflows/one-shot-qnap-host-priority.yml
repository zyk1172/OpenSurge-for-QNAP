name: One-shot QNAP host priority fix

on:
  push:
    branches:
      - 'fix/qnap-host-priority-shadow'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch "$GITHUB_REF_NAME" --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Apply and validate patch
        run: |
          cd repo
          python3 scripts/one-shot-qnap-host-priority.py
          gofmt -w internal/qnaphost/manager.go internal/qnaphost/priority_test.go
          go test ./internal/qnaphost
      - name: Commit result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-qnap-host-priority.yml scripts/one-shot-qnap-host-priority.py
          git add internal/qnaphost/manager.go internal/qnaphost/priority_test.go
          git commit -m 'fix(qnap): outrank QTS host policy routing safely'
          git push origin HEAD:"$GITHUB_REF_NAME"

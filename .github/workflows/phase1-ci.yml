name: Phase 1 CI

on:
  pull_request:
  push:
    branches:
      - port/qnap-linux-docker

permissions:
  contents: read

jobs:
  go-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Build control binaries
        run: |
          go build -o /tmp/omg ./cmd/omg
          go build -o /tmp/opensurge-control ./cmd/opensurge-control

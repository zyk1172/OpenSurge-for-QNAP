name: Resolve release dependencies

on:
  pull_request:
    branches: [master]
    paths:
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/resolve-release-deps.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'release/v1.0.0-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Upgrade vulnerable dependencies
        run: |
          go get github.com/quic-go/quic-go@v0.59.1
          go get golang.org/x/net@v0.55.0
          go get golang.org/x/text@v0.39.0
          go mod tidy
          go test ./...
      - name: Commit resolved module graph
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo 'module graph already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum
          git commit -m 'security(deps): upgrade vulnerable Go modules'
          git push origin HEAD:${{ github.head_ref }}

name: Phase 2 Docker CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'docker/**'
      - 'deploy/qnap/**'
      - 'cmd/opensurge-container/**'
      - 'internal/controlapi/**'
      - 'internal/dhcp/**'
      - 'internal/gateway/**'
      - 'internal/process/**'
      - 'internal/runtime/**'
      - 'internal/webgateway/**'
      - 'internal/webui/**'
      - 'internal/linuxnetwork/**'
      - 'internal/platform/linux/**'
      - 'tests/labnetns/**'
      - 'web/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/phase2-docker.yml'
  push:
    branches: [phase2/docker-productization]

permissions:
  contents: read

jobs:
  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked Web dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Web unit tests
        run: pnpm test
      - name: Build QNAP production Web bundle
        env:
          OPENSURGE_TARGET: qnap
          OPENSURGE_RELEASE_TAG: ci
        run: pnpm build

  compose-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate QNAP Compose
        working-directory: deploy/qnap
        env:
          OPENSURGE_IP: 192.168.50.2
          OPENSURGE_SUBNET: 192.168.50.0/24
          OPENSURGE_GATEWAY: 192.168.50.1
          OPENSURGE_PARENT_INTERFACE: eth0
        run: docker compose -f docker-compose.yml config --quiet

  namespace-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install network lab tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables iproute2 iputils-ping dnsmasq dnsutils
      - name: Compile integration test binaries before entering namespaces
        run: |
          go test -c -o /tmp/opensurge-linux-network.test ./internal/platform/linux
          go test -c -o /tmp/opensurge-gateway.test ./internal/gateway
      - name: Run client -> gateway -> upstream namespace lab
        env:
          OPEN_SURGE_LAB_TEST_BIN: /tmp/opensurge-linux-network.test
          OPEN_SURGE_GATEWAY_TEST_BIN: /tmp/opensurge-gateway.test
        run: bash ./tests/labnetns/lab-test.sh

  image-build:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.platform }} image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          build-args: |
            OPENSURGE_VERSION=pr-${{ github.event.pull_request.number || github.run_number }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=phase2-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=phase2-${{ matrix.platform }}

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build local amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: opensurge-qnap:ci
          cache-from: type=gha,scope=phase2-linux/amd64
      - name: Start Web/control plane
        run: |
          rm -rf /tmp/opensurge-ci-data
          mkdir -p /tmp/opensurge-ci-data
          docker run -d --name opensurge-ci \
            -p 127.0.0.1:18080:8080 \
            -v /tmp/opensurge-ci-data:/data \
            opensurge-qnap:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs opensurge-ci
          exit 1
      - name: Verify first-run auth boundary
        run: |
          test "$(curl -sS -o /tmp/body -w '%{http_code}' http://127.0.0.1:18080/api/v1/overview)" = "401"
          curl -fsS http://127.0.0.1:18080/api/auth/state | grep -q '"setup_required":true'
      - name: Create admin and exercise Linux network discovery
        run: |
          curl -fsS -c /tmp/opensurge-cookies \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:18080' \
            --data '{"username":"admin","password":"phase-two-ci-password"}' \
            http://127.0.0.1:18080/api/auth/setup | grep -q '"authenticated":true'
          curl -fsS -b /tmp/opensurge-cookies \
            http://127.0.0.1:18080/api/v1/network/interfaces \
            | grep -q '"interfaces"'
      - name: Reconcile persisted runtime after container recreation
        run: |
          set -eu
          old_ns="$(docker exec opensurge-ci readlink /proc/self/ns/net)"
          boot_id="$(docker exec opensurge-ci cat /proc/sys/kernel/random/boot_id)"
          docker rm -f opensurge-ci >/dev/null

          docker run -d --name opensurge-ci-recreated \
            -v /tmp/opensurge-ci-data:/data \
            opensurge-qnap:ci
          for i in $(seq 1 30); do
            if docker exec opensurge-ci-recreated curl -fsS http://127.0.0.1:8080/health/ready >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs opensurge-ci-recreated
              exit 1
            fi
            sleep 1
          done

          new_ns="$(docker exec opensurge-ci-recreated readlink /proc/self/ns/net)"
          test "$new_ns" != "$old_ns"
          dns_pid="$(docker exec opensurge-ci-recreated sh -c 'sleep 120 >/dev/null 2>&1 & echo $!')"
          mihomo_pid="$(docker exec opensurge-ci-recreated sh -c 'sleep 120 >/dev/null 2>&1 & echo $!')"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > /tmp/opensurge-ci-data/runtime/state.json <<EOF
          {
            "pid_dnsmasq": $dns_pid,
            "pid_mihomo": $mihomo_pid,
            "boot_session_id": "$boot_id",
            "started_at": "$now",
            "network_snapshot": {
              "schema_version": 2,
              "backend": "linux-nftables",
              "captured_at": "$now",
              "network_namespace": "$old_ns",
              "applied": {}
            }
          }
          EOF

          docker exec opensurge-ci-recreated \
            omg status --config /data/config/opensurge.yaml --format json \
            | grep -q '"runtime_state":"interrupted"'
          docker exec opensurge-ci-recreated \
            omg stop --config /data/config/opensurge.yaml
          docker exec opensurge-ci-recreated sh -c "kill -0 $dns_pid && kill -0 $mihomo_pid"
          test ! -e /tmp/opensurge-ci-data/runtime/state.json
          docker exec opensurge-ci-recreated sh -c "kill $dns_pid $mihomo_pid"
      - name: Dump logs on failure
        if: failure()
        run: |
          docker logs opensurge-ci 2>/dev/null || true
          docker logs opensurge-ci-recreated 2>/dev/null || true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f opensurge-ci >/dev/null 2>&1 || true
          docker rm -f opensurge-ci-recreated >/dev/null 2>&1 || true

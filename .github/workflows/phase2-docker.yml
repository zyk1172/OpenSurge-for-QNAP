name: Phase 2 Docker CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'docker/**'
      - 'deploy/qnap/**'
      - 'cmd/opensurge-container/**'
      - 'cmd/opensurge-manager/**'
      - 'cmd/opensurge-orchestrator/**'
      - 'internal/controlapi/**'
      - 'internal/deployment/**'
      - 'internal/deploymentweb/**'
      - 'internal/dhcp/**'
      - 'internal/gateway/**'
      - 'internal/process/**'
      - 'internal/runtime/**'
      - 'internal/webgateway/**'
      - 'internal/webui/**'
      - 'internal/linuxnetwork/**'
      - 'internal/platform/linux/**'
      - 'tests/labnetns/**'
      - 'web/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/phase2-docker.yml'
  push:
    branches: [phase2/docker-productization]

permissions:
  contents: read

jobs:
  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked Web dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Web unit tests
        run: pnpm test
      - name: Build QNAP production Web bundle
        env:
          OPENSURGE_TARGET: qnap
          OPENSURGE_RELEASE_TAG: ci
        run: pnpm build

  compose-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate default single-container QNAP Compose with creation-time network
        working-directory: deploy/qnap
        env:
          OPENSURGE_IP: 192.168.50.2
          OPENSURGE_SUBNET: 192.168.50.0/24
          OPENSURGE_GATEWAY: 192.168.50.1
          OPENSURGE_PARENT_INTERFACE: eth1
          OPENSURGE_DATA_PATH: /share/Container/opensurge
        run: |
          docker compose -f docker-compose.yml config > /tmp/opensurge-default-compose.yaml
          test "$(docker compose -f docker-compose.yml config --services)" = "opensurge"
          grep -q 'iface: eth1' /tmp/opensurge-default-compose.yaml
          grep -q 'source: /share/Container/opensurge' /tmp/opensurge-default-compose.yaml
          grep -q 'target: /data' /tmp/opensurge-default-compose.yaml
          grep -q 'OPENSURGE_SEED_LAN_IP: 192.168.50.2' /tmp/opensurge-default-compose.yaml
          ! grep -q '/var/run/docker.sock' /tmp/opensurge-default-compose.yaml
          ! grep -q 'opensurge-manager' /tmp/opensurge-default-compose.yaml
          ! grep -q 'opensurge-orchestrator' /tmp/opensurge-default-compose.yaml
      - name: Validate advanced manual QNET Compose with explicit second NIC and bind path
        working-directory: deploy/qnap
        env:
          OPENSURGE_IP: 192.168.50.2
          OPENSURGE_SUBNET: 192.168.50.0/24
          OPENSURGE_GATEWAY: 192.168.50.1
          OPENSURGE_PARENT_INTERFACE: eth1
          OPENSURGE_CONTAINER_INTERFACE: eth0
          OPENSURGE_DATA_PATH: /share/Container/opensurge
        run: |
          docker compose -f docker-compose.manual.yml config > /tmp/opensurge-compose.yaml
          grep -q 'iface: eth1' /tmp/opensurge-compose.yaml
          grep -q '/share/Container/opensurge' /tmp/opensurge-compose.yaml
          grep -q 'OPENSURGE_SEED_LAN_IP: 192.168.50.2' /tmp/opensurge-compose.yaml
      - name: Check deployment shell syntax
        run: |
          sh -n deploy/qnap/preflight.sh
          sh -n docker/entrypoint.sh
      - name: Run static QNAP manual deployment preflight
        run: make qnap-preflight-static
      - name: Reject relative QNAP persistence path in manual fallback
        run: |
          cp deploy/qnap/.env.example /tmp/opensurge-relative.env
          sed -i 's#^OPENSURGE_DATA_PATH=.*#OPENSURGE_DATA_PATH=./data#' /tmp/opensurge-relative.env
          if sh deploy/qnap/preflight.sh --env-file /tmp/opensurge-relative.env --static; then
            echo 'relative persistence path unexpectedly passed preflight' >&2
            exit 1
          fi

  namespace-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install network lab tools from Ubuntu archive
        run: |
          sudo apt-get \
            -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
            -o Dir::Etc::sourceparts="-" \
            update -qq
          sudo apt-get \
            -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
            -o Dir::Etc::sourceparts="-" \
            install -y -qq nftables iproute2 iputils-ping dnsmasq dnsutils
      - name: Compile integration test binaries before entering namespaces
        run: |
          go test -c -o /tmp/opensurge-linux-network.test ./internal/platform/linux
          go test -c -o /tmp/opensurge-gateway.test ./internal/gateway
      - name: Run client -> gateway -> upstream namespace lab
        env:
          OPEN_SURGE_LAB_TEST_BIN: /tmp/opensurge-linux-network.test
          OPEN_SURGE_GATEWAY_TEST_BIN: /tmp/opensurge-gateway.test
        run: bash ./tests/labnetns/lab-test.sh

  image-build:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.platform }} image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          build-args: |
            OPENSURGE_VERSION=pr-${{ github.event.pull_request.number || github.run_number }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=phase2-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=phase2-${{ matrix.platform }}

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build local amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: opensurge-qnap:ci
          cache-from: type=gha,scope=phase2-linux/amd64
      - name: Start Web/control plane with first-run deployment seed
        run: |
          rm -rf /tmp/opensurge-ci-data
          mkdir -p /tmp/opensurge-ci-data
          docker run -d --name opensurge-ci \
            -p 127.0.0.1:18080:8080 \
            -e OPENSURGE_SEED_LAN_IP=10.55.0.2 \
            -e OPENSURGE_SEED_LAN_CIDR=10.55.0.0/24 \
            -e OPENSURGE_SEED_UPSTREAM_GATEWAY=10.55.0.1 \
            -e OPENSURGE_CONTAINER_INTERFACE=eth0 \
            -v /tmp/opensurge-ci-data:/data \
            opensurge-qnap:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs opensurge-ci
          exit 1
      - name: Verify first-run Compose values seeded persistent config
        run: |
          docker exec opensurge-ci grep -q 'lan_ip: "10.55.0.2"' /data/config/opensurge.yaml
          docker exec opensurge-ci grep -q 'lan_cidr: "10.55.0.0/24"' /data/config/opensurge.yaml
          docker exec opensurge-ci grep -q 'upstream_gateway: "10.55.0.1"' /data/config/opensurge.yaml
          docker exec opensurge-ci grep -q 'interface: "eth0"' /data/config/opensurge.yaml
      - name: Verify QNAP image and privilege split
        run: |
          set -euo pipefail
          docker exec opensurge-ci test ! -e /usr/local/bin/opensurge-manager
          docker exec opensurge-ci test ! -e /usr/local/bin/opensurge-orchestrator
          docker exec opensurge-ci command -v setpriv >/dev/null
          web_pid="$(docker exec opensurge-ci sh -c 'for p in /proc/[0-9]*; do cmd="$(tr "\000" " " < "$p/cmdline" 2>/dev/null || true)"; case "$cmd" in *"--component web"*) basename "$p"; break;; esac; done')"
          control_pid="$(docker exec opensurge-ci sh -c 'for p in /proc/[0-9]*; do cmd="$(tr "\000" " " < "$p/cmdline" 2>/dev/null || true)"; case "$cmd" in *"--component control"*) basename "$p"; break;; esac; done')"
          test -n "$web_pid"
          test -n "$control_pid"
          web_uid="$(docker exec opensurge-ci sh -c "set -- \$(grep '^Uid:' /proc/$web_pid/status); echo \$2")"
          control_uid="$(docker exec opensurge-ci sh -c "set -- \$(grep '^Uid:' /proc/$control_pid/status); echo \$2")"
          web_caps="$(docker exec opensurge-ci sh -c "set -- \$(grep '^CapEff:' /proc/$web_pid/status); echo \$2")"
          echo "web pid=$web_pid uid=$web_uid CapEff=$web_caps"
          echo "control pid=$control_pid uid=$control_uid"
          test "$web_uid" = "65532"
          test "$control_uid" = "0"
          test "$web_caps" = "0000000000000000"
      - name: Verify first-run auth boundary and bootstrap token
        run: |
          set -euo pipefail
          test "$(curl -sS -o /tmp/body -w '%{http_code}' http://127.0.0.1:18080/api/v1/overview)" = "401"
          state="$(curl -fsS http://127.0.0.1:18080/api/auth/state)"
          printf '%s\n' "$state" | grep -q '"setup_required":true'
          printf '%s\n' "$state" | grep -q '"bootstrap_required":true'
          test "$(curl -sS -o /tmp/setup-without-token -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:18080' \
            --data '{"username":"admin","password":"phase-two-ci-password"}' \
            http://127.0.0.1:18080/api/auth/setup)" = "403"
          bootstrap_token="$(docker exec opensurge-ci cat /data/web-auth/bootstrap-token | tr -d '\r\n')"
          test -n "$bootstrap_token"
          curl -fsS -c /tmp/opensurge-cookies \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:18080' \
            --data "{\"username\":\"admin\",\"password\":\"phase-two-ci-password\",\"bootstrap_token\":\"$bootstrap_token\"}" \
            http://127.0.0.1:18080/api/auth/setup | grep -q '"authenticated":true'
          docker exec opensurge-ci test ! -e /data/web-auth/bootstrap-token
          docker exec opensurge-ci test -f /data/web-auth/admin.json
      - name: Exercise Linux network discovery
        run: |
          curl -fsS -b /tmp/opensurge-cookies \
            http://127.0.0.1:18080/api/v1/network/interfaces \
            | grep -q '"interfaces"'
      - name: Reconcile persisted runtime after container recreation
        run: |
          set -euo pipefail
          old_ns="$(docker exec opensurge-ci readlink /proc/self/ns/net)"
          boot_id="$(docker exec opensurge-ci cat /proc/sys/kernel/random/boot_id)"

          docker run -d --name opensurge-ci-recreated \
            -e OPENSURGE_SEED_LAN_IP=10.99.0.2 \
            -e OPENSURGE_SEED_LAN_CIDR=10.99.0.0/24 \
            -e OPENSURGE_SEED_UPSTREAM_GATEWAY=10.99.0.1 \
            -v /tmp/opensurge-ci-data:/data \
            opensurge-qnap:ci
          for i in $(seq 1 30); do
            if docker exec opensurge-ci-recreated curl -fsS http://127.0.0.1:8080/health/ready >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "replacement container did not become ready" >&2
              docker logs opensurge-ci-recreated
              exit 1
            fi
            sleep 1
          done

          docker exec opensurge-ci-recreated grep -q 'lan_ip: "10.55.0.2"' /data/config/opensurge.yaml
          docker exec opensurge-ci-recreated grep -q 'lan_cidr: "10.55.0.0/24"' /data/config/opensurge.yaml
          docker exec opensurge-ci-recreated grep -q 'upstream_gateway: "10.55.0.1"' /data/config/opensurge.yaml
          docker exec opensurge-ci-recreated test -f /data/web-auth/admin.json
          docker exec opensurge-ci-recreated test ! -e /data/web-auth/bootstrap-token
          docker exec opensurge-ci-recreated curl -fsS http://127.0.0.1:8080/api/auth/state | grep -q '"setup_required":false'
          if docker exec opensurge-ci-recreated grep -q '10.99.0.2' /data/config/opensurge.yaml; then
            echo "replacement container overwrote persistent configuration from deployment seed variables" >&2
            exit 1
          fi

          new_ns="$(docker exec opensurge-ci-recreated readlink /proc/self/ns/net)"
          echo "original namespace:    $old_ns"
          echo "replacement namespace: $new_ns"
          if [ "$new_ns" = "$old_ns" ]; then
            echo "replacement unexpectedly shares the original network namespace" >&2
            exit 1
          fi

          docker rm -f opensurge-ci >/dev/null

          dns_pid="$(docker exec opensurge-ci-recreated sh -c 'sleep 120 >/dev/null 2>&1 & echo $!')"
          mihomo_pid="$(docker exec opensurge-ci-recreated sh -c 'sleep 120 >/dev/null 2>&1 & echo $!')"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker exec -i opensurge-ci-recreated sh -c 'cat > /data/runtime/state.json' <<EOF
          {
            "pid_dnsmasq": $dns_pid,
            "pid_mihomo": $mihomo_pid,
            "boot_session_id": "$boot_id",
            "started_at": "$now",
            "network_snapshot": {
              "schema_version": 2,
              "backend": "linux-nftables",
              "captured_at": "$now",
              "network_namespace": "$old_ns",
              "applied": {}
            }
          }
          EOF

          status_json="$(docker exec opensurge-ci-recreated \
            omg status --config /data/config/opensurge.yaml --format json)"
          echo "status after recreation: $status_json"
          if ! printf '%s\n' "$status_json" | grep -Eq '"runtime_state"[[:space:]]*:[[:space:]]*"interrupted"'; then
            echo "replacement container did not classify persisted runtime as interrupted" >&2
            exit 1
          fi

          stop_output="$(docker exec opensurge-ci-recreated \
            omg stop --config /data/config/opensurge.yaml 2>&1)" || {
              rc=$?
              echo "$stop_output" >&2
              echo "interrupted runtime cleanup failed with exit code $rc" >&2
              exit "$rc"
            }
          echo "$stop_output"

          if ! docker exec opensurge-ci-recreated sh -c "kill -0 $dns_pid && kill -0 $mihomo_pid"; then
            echo "interrupted cleanup signalled a PID owned by the replacement container" >&2
            exit 1
          fi
          if docker exec opensurge-ci-recreated test -e /data/runtime/state.json; then
            echo "interrupted cleanup left stale runtime state behind" >&2
            exit 1
          fi
          docker exec opensurge-ci-recreated sh -c "kill $dns_pid $mihomo_pid"
      - name: Dump logs on failure
        if: failure()
        run: |
          docker logs opensurge-ci 2>/dev/null || true
          docker logs opensurge-ci-recreated 2>/dev/null || true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f opensurge-ci >/dev/null 2>&1 || true
          docker rm -f opensurge-ci-recreated >/dev/null 2>&1 || true

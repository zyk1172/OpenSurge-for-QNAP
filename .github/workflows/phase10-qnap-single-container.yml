name: Phase 10 QNAP Single-Container CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'cmd/opensurge-container/**'
      - 'internal/controlapi/**'
      - 'internal/doctor/**'
      - 'internal/gateway/**'
      - 'internal/linuxnetwork/**'
      - 'internal/mihomo/**'
      - 'internal/platform/**'
      - 'internal/process/**'
      - 'internal/runtime/**'
      - 'internal/webgateway/**'
      - 'docker/**'
      - 'deploy/qnap/**'
      - 'web/**'
      - 'docs/**'
      - 'README.md'
      - 'README.en.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/phase10-qnap-single-container.yml'

permissions:
  contents: read

jobs:
  compose-single-container:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENSURGE_IP: 192.168.50.2
      OPENSURGE_SUBNET: 192.168.50.0/24
      OPENSURGE_GATEWAY: 192.168.50.1
      OPENSURGE_PARENT_INTERFACE: eth1
      OPENSURGE_DATA_PATH: /share/Container/opensurge
      OPENSURGE_WEB_UID: 1000
      OPENSURGE_WEB_GID: 100
    steps:
      - uses: actions/checkout@v4
      - name: Validate QNAP shell scripts
        run: |
          sh -n deploy/qnap/preflight.sh
          sh -n docker/entrypoint.sh
      - name: Resolve creation-time QNAP Compose
        working-directory: deploy/qnap
        run: docker compose -f docker-compose.yml config > /tmp/opensurge-qnap-compose.yaml
      - name: Require exactly one OpenSurge service
        working-directory: deploy/qnap
        run: |
          services="$(docker compose -f docker-compose.yml config --services)"
          test "$services" = "opensurge"
          ! grep -q 'opensurge-manager' /tmp/opensurge-qnap-compose.yaml
          ! grep -q 'opensurge-orchestrator' /tmp/opensurge-qnap-compose.yaml
          ! grep -q '/var/run/docker.sock' /tmp/opensurge-qnap-compose.yaml
          ! grep -qE '^[[:space:]]+build:' /tmp/opensurge-qnap-compose.yaml
      - name: Verify QNET, persistence, and QNAP Web identity
        run: |
          grep -q 'iface: eth1' /tmp/opensurge-qnap-compose.yaml
          grep -q 'ipv4_address: 192.168.50.2' /tmp/opensurge-qnap-compose.yaml
          grep -q 'OPENSURGE_SEED_LAN_IP: 192.168.50.2' /tmp/opensurge-qnap-compose.yaml
          grep -q 'OPENSURGE_SEED_LAN_CIDR: 192.168.50.0/24' /tmp/opensurge-qnap-compose.yaml
          grep -q 'OPENSURGE_SEED_UPSTREAM_GATEWAY: 192.168.50.1' /tmp/opensurge-qnap-compose.yaml
          grep -q 'OPENSURGE_WEB_UID: 1000' /tmp/opensurge-qnap-compose.yaml
          grep -q 'OPENSURGE_WEB_GID: 100' /tmp/opensurge-qnap-compose.yaml
          grep -q 'source: /share/Container/opensurge' /tmp/opensurge-qnap-compose.yaml
          grep -q 'target: /data' /tmp/opensurge-qnap-compose.yaml
          grep -q 'NET_ADMIN' /tmp/opensurge-qnap-compose.yaml
          grep -q 'NET_RAW' /tmp/opensurge-qnap-compose.yaml
          grep -q '/dev/net/tun' /tmp/opensurge-qnap-compose.yaml
      - name: Guard QNAP permission model
        run: |
          grep -q 'OPENSURGE_WEB_UID:-1000' docker/entrypoint.sh
          grep -q 'OPENSURGE_WEB_GID:-100' docker/entrypoint.sh
          grep -q 'permission_probe' deploy/qnap/preflight.sh
          grep -q -- '--user "${web_uid}:${web_gid}"' deploy/qnap/preflight.sh
          ! grep -Eq 'chmod[[:space:]]+-R[[:space:]]+777|chown[[:space:]]+-R' docker/entrypoint.sh deploy/qnap/preflight.sh
      - name: Guard QNAP image surface
        run: |
          ! grep -q '/out/opensurge-manager' docker/Dockerfile
          ! grep -q '/out/opensurge-orchestrator' docker/Dockerfile
          ! grep -q 'COPY --from=go-builder /out/opensurge-manager' docker/Dockerfile
          ! grep -q 'COPY --from=go-builder /out/opensurge-orchestrator' docker/Dockerfile
          grep -q 'util-linux' docker/Dockerfile
          grep -q -- '--component web' docker/entrypoint.sh
          grep -q -- '--component control' docker/entrypoint.sh
          grep -q -- '--bounding-set=-all' docker/entrypoint.sh
          grep -q -- '--require-bootstrap-token' docker/entrypoint.sh

  qnap-web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        working-directory: web
        run: pnpm test
      - name: Build QNAP target
        working-directory: web
        env:
          OPENSURGE_TARGET: qnap
          OPENSURGE_RELEASE_TAG: phase10-ci
        run: pnpm build
      - name: Guard QNAP product surface against desktop residue
        run: |
          ! grep -Eq 'Finder|合盖|Wi-Fi DHCP|mac_static|applyStatic|restoreMacDHCP|revealSourceSnapshot|nftables 数据面' web/src/pages/QNAPNetworkPage.tsx web/src/pages/QNAPSourcesPage.tsx
          grep -q 'qnapBuild ? releaseTag' web/src/App.tsx
          grep -q '!qnapBuild && <ServiceState label="PF Anchor"' web/src/components/GatewayHealthCard.tsx
          grep -q 'OpenSurge 负责网关生命周期；mihomo 是当前代理引擎。' web/src/pages/DashboardPage.tsx
          grep -q '修改以下任一项需要重建 OpenSurge 容器' web/src/pages/QNAPNetworkPage.tsx
          grep -q 'desired/运行版本' web/src/pages/QNAPSourcesPage.tsx
          grep -q "'本机 Mac': 'OpenSurge 网关'" web/src/i18n.ts
          grep -q "'Mac 本机运行路径': 'OpenSurge 网关路径'" web/src/i18n.ts
          grep -q "DNS、mihomo 与 TUN 数据面会短暂重载" web/src/i18n.ts
      - name: Guard QNAP responsive diagnostics surface
        run: |
          grep -q 'data-product-target="qnap"' web/src/qnap-enhancements.css
          grep -q 'min-width: 0' web/src/qnap-enhancements.css
          grep -q 'QNAP Environment Doctor' web/src/pages/DiagnosticsPage.tsx
          grep -q 'diagnostic-summary-grid' web/src/pages/DiagnosticsPage.tsx
      - name: Guard current QNAP docs against Mac product identity
        run: |
          ! grep -Eq '^# .*OpenSurge for Mac|^# 为 OpenSurge for Mac|OpenSurge for Mac App 使用指南|OpenSurge for Mac App User Guide' README.md README.en.md CONTRIBUTING.md AGENTS.md docs/app-user-guide.md docs/app-user-guide.zh-CN.md docs/faq.md docs/faq.zh-CN.md
          test ! -e .github/workflows/release-unsigned.yml

  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Linux process identity does not require ps
        run: |
          go test ./internal/process -run 'TestLinuxProcessIdentityUsesProcfsWithoutPS|TestFingerprintMatchesCurrentProcessAndRejectsDifferentIdentity|TestFingerprintTreatsMissingProcessAsAbsent' -count=1
          grep -q 'if runtime.GOOS == "linux"' internal/process/process.go
          grep -q 'identity, err = linuxProcessIdentity(pid)' internal/process/process.go
          test "$(grep -c 'exec.Command("/bin/ps"' internal/process/process.go)" -eq 1
          grep -q 'func psProcessIdentity' internal/process/process.go
      - name: QNAP Doctor storage tests
        run: go test ./internal/doctor -run 'TestCheckWritableDirectory|TestCheckTUNDevice' -count=1
      - name: Guard Linux Doctor against macOS-only requirements
        run: |
          grep -q 'goruntime.GOOS == "linux"' internal/doctor/doctor.go
          grep -q 'checkCommand("iproute2", "ip")' internal/doctor/doctor.go
          grep -q 'checkTUNDevice("/dev/net/tun")' internal/doctor/doctor.go
      - name: QNAP Web security boundary tests
        run: go test ./internal/webgateway -run 'TestQNAPFirstAdminRequiresBootstrapToken|TestQNAPDesktopOnlyPathsAreBlocked|TestReadyRequiresAuthenticatedControlConfig' -count=1
      - name: QNAP Mihomo exposure tests
        run: go test ./internal/mihomo -run 'TestTUNModeKeepsMihomoInternalListenersOnLoopback|TestTransparentOffExplicitlyEnablesManualLANMixedPort' -count=1
      - name: QNAP source network policy tests
        run: go test ./internal/controlapi -run 'TestSourceIPAllowedOnlyForPublicDestinations' -count=1
      - name: Profile persistence tests
        run: go test ./internal/controlapi -run 'TestApplyProfileLeavesStoppedGatewayPendingForNextStart|TestApplyProfileFlowStyleUsesAuthoritativeRenderer' -count=1
      - name: QNAP container runner tests
        run: go test ./internal/controlapi -run 'Container|QNAP' -count=1

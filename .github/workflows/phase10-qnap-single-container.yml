name: Phase 10 QNAP Single-Container CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'cmd/opensurge-container/**'
      - 'internal/controlapi/**'
      - 'internal/gateway/**'
      - 'internal/linuxnetwork/**'
      - 'internal/runtime/**'
      - 'docker/**'
      - 'deploy/qnap/**'
      - 'web/**'
      - 'docs/**'
      - 'README.md'
      - 'README.en.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/phase10-qnap-single-container.yml'

permissions:
  contents: read

jobs:
  compose-single-container:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENSURGE_IP: 192.168.50.2
      OPENSURGE_SUBNET: 192.168.50.0/24
      OPENSURGE_GATEWAY: 192.168.50.1
      OPENSURGE_PARENT_INTERFACE: eth1
      OPENSURGE_DATA_PATH: /share/Container/opensurge
    steps:
      - uses: actions/checkout@v4
      - name: Resolve creation-time QNAP Compose
        working-directory: deploy/qnap
        run: docker compose -f docker-compose.yml config > /tmp/opensurge-qnap-compose.yaml
      - name: Require exactly one OpenSurge service
        working-directory: deploy/qnap
        run: |
          services="$(docker compose -f docker-compose.yml config --services)"
          test "$services" = "opensurge"
          ! grep -q 'opensurge-manager' /tmp/opensurge-qnap-compose.yaml
          ! grep -q 'opensurge-orchestrator' /tmp/opensurge-qnap-compose.yaml
          ! grep -q '/var/run/docker.sock' /tmp/opensurge-qnap-compose.yaml
          ! grep -qE '^[[:space:]]+build:' /tmp/opensurge-qnap-compose.yaml
      - name: Verify QNET and persistent creation parameters
        run: |
          grep -q 'iface: eth1' /tmp/opensurge-qnap-compose.yaml
          grep -q 'ipv4_address: 192.168.50.2' /tmp/opensurge-qnap-compose.yaml
          grep -q 'OPENSURGE_SEED_LAN_IP: 192.168.50.2' /tmp/opensurge-qnap-compose.yaml
          grep -q 'OPENSURGE_SEED_LAN_CIDR: 192.168.50.0/24' /tmp/opensurge-qnap-compose.yaml
          grep -q 'OPENSURGE_SEED_UPSTREAM_GATEWAY: 192.168.50.1' /tmp/opensurge-qnap-compose.yaml
          grep -q 'source: /share/Container/opensurge' /tmp/opensurge-qnap-compose.yaml
          grep -q 'target: /data' /tmp/opensurge-qnap-compose.yaml
          grep -q 'NET_ADMIN' /tmp/opensurge-qnap-compose.yaml
          grep -q 'NET_RAW' /tmp/opensurge-qnap-compose.yaml
          grep -q '/dev/net/tun' /tmp/opensurge-qnap-compose.yaml

  qnap-web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        working-directory: web
        run: pnpm test
      - name: Build QNAP target
        working-directory: web
        env:
          OPENSURGE_TARGET: qnap
          OPENSURGE_RELEASE_TAG: phase10-ci
        run: pnpm build
      - name: Guard QNAP product surface against desktop residue
        run: |
          ! grep -Eq 'Finder|合盖|Wi-Fi DHCP|mac_static|applyStatic|restoreMacDHCP|revealSourceSnapshot|nftables 数据面' web/src/pages/QNAPNetworkPage.tsx web/src/pages/QNAPSourcesPage.tsx
          grep -q 'qnapBuild ? releaseTag' web/src/App.tsx
          grep -q '!qnapBuild && <ServiceState label="PF Anchor"' web/src/components/GatewayHealthCard.tsx
          grep -q 'OpenSurge 负责网关生命周期；mihomo 是当前代理引擎。' web/src/pages/DashboardPage.tsx
          grep -q '修改以下任一项需要重建 OpenSurge 容器' web/src/pages/QNAPNetworkPage.tsx
          grep -q 'desired/运行版本' web/src/pages/QNAPSourcesPage.tsx
      - name: Guard current QNAP docs against Mac product identity
        run: |
          ! grep -Eq '^# .*OpenSurge for Mac|^# 为 OpenSurge for Mac|OpenSurge for Mac App 使用指南|OpenSurge for Mac App User Guide' README.md README.en.md CONTRIBUTING.md AGENTS.md docs/app-user-guide.md docs/app-user-guide.zh-CN.md docs/faq.md docs/faq.zh-CN.md
          test ! -e .github/workflows/release-unsigned.yml

  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Profile persistence tests
        run: go test ./internal/controlapi -run 'TestApplyProfileLeavesStoppedGatewayPendingForNextStart|TestApplyProfileFlowStyleUsesAuthoritativeRenderer' -count=1
      - name: QNAP container runner tests
        run: go test ./internal/controlapi -run 'Container|QNAP' -count=1
